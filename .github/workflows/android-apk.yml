# Build the sideloadable APK: the home-screen widget and the Connect IQ
# companion (android/README.md). The phone has no Android build tooling and
# the machines this repo is written on cannot reach Google's Maven, so this
# runner is the only compiler the Android half has; every install starts as
# the artifact of a run.
#
# The pure-JVM core is tested first, against vectors/quota.json -- the same
# tests `make android-test` runs -- so an APK is never built from a port that
# has drifted from the Python.
#
# Signing: a stable key from the repository secrets ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD, so
# each build installs over the last. Without them a key is minted for the run,
# and that build will not upgrade over any other: uninstall first. The repo is
# public, so the keystore is only ever a secret, never a file.

name: android apk

on:
  push:
    paths:
      - 'android/**'
      - 'vectors/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4
        with:
          # The version code is the commit count, so a newer build always
          # installs over an older one.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the core against the vectors
        run: ./gradlew -p core test

      - name: Signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          store="$RUNNER_TEMP/release.jks"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Signing with the keystore from the repository secrets."
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$store"
            {
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this APK is signed with a key minted for this run, and will not install over any other build. See android/README.md."
            password="$(openssl rand -hex 24)"
            echo "::add-mask::$password"
            keytool -genkeypair -noprompt -keystore "$store" -storetype PKCS12 \
              -storepass "$password" -keypass "$password" -alias zwana \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -dname "CN=zwana quota (minted for run ${{ github.run_id }})"
            {
              echo "ANDROID_KEYSTORE_PASSWORD=$password"
              echo "ANDROID_KEY_ALIAS=zwana"
              echo "ANDROID_KEY_PASSWORD=$password"
            } >> "$GITHUB_ENV"
          fi
          echo "ANDROID_KEYSTORE_FILE=$store" >> "$GITHUB_ENV"

      - name: Build the APK
        run: |
          export VERSION_CODE="$(git rev-list --count HEAD)"
          export VERSION_NAME="$(git rev-parse --short HEAD)"
          ./gradlew :app:assembleRelease
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/zwana-quota.apk
          cd ../out
          sha256sum zwana-quota.apk > zwana-quota.apk.sha256
          ls -l
          # Which key signed it, so a failed upgrade can be told from a bad APK.
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" \
            verify --print-certs zwana-quota.apk | grep -E 'Signer #1 certificate (DN|SHA-256)' | tee signer.txt

      - name: Lint (reported, not gating)
        continue-on-error: true
        run: ./gradlew :app:lintRelease

      - uses: actions/upload-artifact@v4
        with:
          name: zwana-quota-android
          path: out/
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-release.html
          retention-days: 14
          if-no-files-found: ignore
