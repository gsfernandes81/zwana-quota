# Build the sideloadable APK: the home-screen widget and the Connect IQ
# companion (android/README.md). The phone has no Android build tooling and
# the machines this repo is written on cannot reach Google's Maven, so this
# runner is the only compiler the Android half has; every install starts as
# the artifact of a run.
#
# The pure-JVM core is tested first, against vectors/quota.json -- the same
# tests `make android-test` runs -- so an APK is never built from a port that
# has drifted from the Python.
#
# Signing: a stable key from the repository secret ANDROID_KEYSTORE_BASE64
# (and ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# only if the keystore has a password or another alias), so each build
# installs over the last. Without them a key is minted for the run,
# and that build will not upgrade over any other: uninstall first. The repo is
# public, so the keystore is only ever a secret, never a file.

name: android apk

on:
  push:
    paths:
      - 'android/**'
      - 'vectors/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4
        with:
          # The version code is the commit count, so a newer build always
          # installs over an older one.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the core against the vectors
        run: ./gradlew -p core test

      - name: Signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          store="$RUNNER_TEMP/release.p12"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Signing with the keystore from the repository secrets."
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$store"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this APK is signed with a key minted for this run, and will not install over any other build. See android/README.md."
            # Minted exactly as android/README.md makes yours -- openssl, no
            # password, alias zwana -- so every run without the secret also
            # proves that a keystore made that way signs.
            openssl req -x509 -newkey rsa:4096 -keyout "$RUNNER_TEMP/k.pem" -out "$RUNNER_TEMP/c.pem" \
              -days 10000 -nodes -subj "/CN=zwana quota (minted for run ${{ github.run_id }})" 2>/dev/null
            openssl pkcs12 -export -in "$RUNNER_TEMP/c.pem" -inkey "$RUNNER_TEMP/k.pem" \
              -name zwana -out "$store" -passout pass:
            rm -f "$RUNNER_TEMP/k.pem" "$RUNNER_TEMP/c.pem"
          fi
          # Passwords and the alias are optional: unset means no password and
          # the alias zwana (android/app/build.gradle.kts).
          {
            echo "ANDROID_KEYSTORE_FILE=$store"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build the APK
        run: |
          export VERSION_CODE="$(git rev-list --count HEAD)"
          export VERSION_NAME="$(git rev-parse --short HEAD)"
          ./gradlew :app:assembleRelease
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/zwana-quota.apk
          cd ../out
          sha256sum zwana-quota.apk > zwana-quota.apk.sha256
          ls -l
          # Which key signed it, so a failed upgrade can be told from a bad APK.
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --verbose --print-certs zwana-quota.apk > signer.txt 2>&1
          cat signer.txt

      # The app's screen drawn on the JVM (app/src/test/.../ScreensTest.kt), so
      # it can be looked at without a phone. Printed into the log as small
      # JPEGs between markers; not gating, since it is a picture, not a test.
      - name: Render the screens
        continue-on-error: true
        run: |
          ./gradlew :app:testReleaseUnitTest --tests '*ScreensTest*'
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import base64, glob, io, os
          from PIL import Image
          for path in sorted(glob.glob("app/build/screens/*.png")):
              im = Image.open(path).convert("RGB")
              w = 480
              im = im.resize((w, round(im.height * w / im.width)), Image.LANCZOS)
              buf = io.BytesIO(); im.save(buf, "JPEG", quality=62, optimize=True)
              data = base64.b64encode(buf.getvalue()).decode()
              name = os.path.basename(path)
              print(f"=== SCREEN {name} {im.size} {len(buf.getvalue())} bytes")
              for i in range(0, len(data), 120):
                  print(data[i:i + 120])
              print(f"=== END {name}")
          PY

      - name: Lint (reported, not gating)
        continue-on-error: true
        run: |
          ./gradlew :app:lintRelease
          cat app/build/reports/lint-results.txt

      - uses: actions/upload-artifact@v4
        with:
          name: zwana-quota-android
          path: out/
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-release.html
          retention-days: 14
          if-no-files-found: ignore
