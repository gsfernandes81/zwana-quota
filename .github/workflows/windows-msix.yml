# Build the sideloadable MSIX. The target machine is on a metered satellite
# link and has no build tooling, so this runner is the only compiler the
# Windows half has — which is also why the package bundles its runtimes rather
# than asking that machine to go and fetch them, and why its size is treated
# as a feature of the build rather than an afterthought.
#
# Two variants are built every run, because neither can be tested from the
# machine that writes them:
#
#   slim  — the Widgets component package on the ordinary .NET runtime. The
#           safe one, and the fallback if aot misbehaves on the board.
#   aot   — the same, compiled ahead of time: no CLR, no metadata projection,
#           a few megabytes instead of forty. Native AOT changes how COM and
#           WinRT activation are wired, and nothing here can drive the widgets
#           board, so it is offered with its risk stated rather than assumed.
#
# Nothing here touches the Python half: .githooks/checks.sh is untouched, and
# this workflow only runs when windows/** changes.
#
# Signing: a self-signed certificate is minted per run unless the repository
# carries MSIX_PFX_BASE64 / MSIX_PFX_PASSWORD. See windows/README.md.

name: windows msix

on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-msix.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  msix:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: slim
            publish_args: ''
          - variant: aot
            publish_args: '-p:PublishAot=true -p:CsWinRTAotOptimizerEnabled=true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish the provider (${{ matrix.variant }})
        run: |
          dotnet publish windows/ZwanaQuotaWidget/ZwanaQuotaWidget.csproj `
            -c Release -r win-x64 ${{ matrix.publish_args }} -o staging
          if ($LASTEXITCODE -ne 0) { throw "publish failed" }

      - name: Verify registration-free WinRT is wired up
        run: |
          # Self-contained Windows App SDK does not register its WinRT classes
          # through the package manifest. Microsoft.WindowsAppSDK.Base turns the
          # Widgets package's appxfragment into a side-by-side manifest embedded
          # in the exe, and WidgetManager.GetDefault() fails with
          # class-not-registered without it. It is invisible, it is easy to lose
          # to a project change, and it is one grep.
          $exe = 'staging/ZwanaQuotaWidget.exe'
          $bytes = [IO.File]::ReadAllBytes($exe)
          $text = [Text.Encoding]::UTF8.GetString($bytes)
          $wanted = @(
            'activatableClass',
            'Microsoft.Windows.Widgets.dll',
            'Microsoft.Windows.Widgets.Providers.WidgetManager'
          )
          $missing = $wanted | Where-Object { $text -notlike "*$_*" }
          if ($missing) {
            throw "the exe's embedded manifest is missing: $($missing -join ', ')"
          }
          "embedded manifest registers the Widgets WinRT classes" | Write-Host

          if (-not (Test-Path staging/Microsoft.Windows.Widgets.dll)) {
            throw "Microsoft.Windows.Widgets.dll was not published beside the exe"
          }

      - name: Render the card without a widgets board
        run: |
          # The drawing path is the only part of a provider that can be
          # exercised here, and it is where this went wrong the first time: the
          # card was serialised with reflection, which Native AOT does not do,
          # so it threw inside the callback that draws and the widget pinned
          # and showed nothing. Startup was fine. Only this catches that.
          & (Resolve-Path staging/ZwanaQuotaWidget.exe) --render-selftest "$PWD/card.json"
          if ($LASTEXITCODE -ne 0) { throw "the render self-test exited $LASTEXITCODE" }
          if (-not (Test-Path card.json)) { throw "the render self-test wrote no card" }

          $card = Get-Content card.json -Raw
          $parsed = $card | ConvertFrom-Json   # throws if the board could not parse it either
          if ($parsed.type -ne 'AdaptiveCard') { throw "not an Adaptive Card: $($parsed.type)" }
          if (-not $parsed.body) { throw "the card has no body" }
          "card renders: $($card.Length) chars, $($parsed.body.Count) blocks" | Write-Host

      - name: Smoke test the provider
        run: |
          # It registers a class object and waits for the host. Nothing here can
          # exercise the widgets board, but a process that dies on startup is a
          # provider that would silently never draw — which is exactly how a
          # trimmed build fails.
          $p = Start-Process -FilePath (Resolve-Path staging/ZwanaQuotaWidget.exe) -PassThru `
            -RedirectStandardOutput smoke.out -RedirectStandardError smoke.err
          Start-Sleep -Seconds 5
          if ($p.HasExited) {
            # A provider that dies here would pin and never draw, and say
            # nothing about why, so whatever it did say is worth keeping.
            Get-Content smoke.out, smoke.err -ErrorAction SilentlyContinue |
              Select-Object -Last 40 | Write-Host
            throw "the provider exited on startup with code $($p.ExitCode)"
          }
          "still running after 5s" | Write-Host
          Stop-Process -Id $p.Id -Force

      - name: Stage the package layout
        run: |
          Copy-Item windows/ZwanaQuotaWidget/AppxManifest.xml staging/AppxManifest.xml
          Copy-Item windows/ZwanaQuotaWidget/Images staging/Images -Recurse -Force
          Copy-Item windows/ZwanaQuotaWidget/ProviderAssets staging/ProviderAssets -Recurse -Force
          Get-ChildItem staging -Filter *.pdb -Recurse | Remove-Item -Force

          # Localised resources for machinery this widget does not draw with.
          Get-ChildItem staging -Directory |
            Where-Object { $_.Name -match '^[a-z]{2}(-[A-Za-z]{2,8})*$' -and $_.Name -ne 'en-US' } |
            Remove-Item -Recurse -Force

      - name: Locate the Windows SDK tools
        run: |
          $bin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $versions = Get-ChildItem $bin -Directory |
            Where-Object { $_.Name -like '10.*' } |
            Sort-Object { [version]$_.Name } -Descending
          foreach ($v in $versions) {
            $makeappx = Join-Path $v.FullName 'x64\makeappx.exe'
            $signtool = Join-Path $v.FullName 'x64\signtool.exe'
            if ((Test-Path $makeappx) -and (Test-Path $signtool)) {
              "MAKEAPPX=$makeappx" | Out-File $env:GITHUB_ENV -Append
              "SIGNTOOL=$signtool" | Out-File $env:GITHUB_ENV -Append
              "Using the SDK in $($v.Name)" | Write-Host
              exit 0
            }
          }
          throw "no makeappx/signtool on this image"

      - name: Prepare the signing certificate
        env:
          MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null

          if ($env:MSIX_PFX_BASE64) {
            Write-Host "Signing with the certificate from the repository secrets."
            [IO.File]::WriteAllBytes("$PWD\signing.pfx", [Convert]::FromBase64String($env:MSIX_PFX_BASE64))
            $password = ConvertTo-SecureString -String $env:MSIX_PFX_PASSWORD -AsPlainText -Force
            $data = Get-PfxData -FilePath "$PWD\signing.pfx" -Password $password
            $cert = $data.EndEntityCertificates[0]
            Export-Certificate -Cert $cert -FilePath out/zwana-quota.cer | Out-Null
            "SIGN_WITH=pfx" | Out-File $env:GITHUB_ENV -Append
          }
          else {
            Write-Host "No MSIX_PFX_BASE64 secret: minting a self-signed certificate for this run."
            [xml]$manifest = Get-Content windows/ZwanaQuotaWidget/AppxManifest.xml
            $subject = $manifest.Package.Identity.Publisher
            $cert = New-SelfSignedCertificate `
              -Type Custom `
              -Subject $subject `
              -KeyUsage DigitalSignature `
              -FriendlyName 'zwana-quota sideload' `
              -CertStoreLocation 'Cert:\CurrentUser\My' `
              -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
            Export-Certificate -Cert $cert -FilePath out/zwana-quota.cer | Out-Null
            "SIGN_WITH=store" | Out-File $env:GITHUB_ENV -Append
            "CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File $env:GITHUB_ENV -Append
          }

          # The package's Publisher and the signer have to be the same string
          # or Windows refuses the install, so the manifest follows the
          # certificate rather than the other way round.
          "CERT_SUBJECT=$($cert.Subject)" | Out-File $env:GITHUB_ENV -Append

      - name: Match the manifest publisher to the certificate
        run: |
          $path = "$PWD\staging\AppxManifest.xml"
          [xml]$manifest = Get-Content $path
          if ($manifest.Package.Identity.Publisher -ne $env:CERT_SUBJECT) {
            "publisher: $($manifest.Package.Identity.Publisher) -> $env:CERT_SUBJECT" | Write-Host
            $manifest.Package.Identity.Publisher = $env:CERT_SUBJECT
            $manifest.Save($path)
          }

      - name: Pack
        run: |
          # makeappx narrates every payload file, which buries everything else
          # in the log. Kept on disk, shown only if it fails.
          & $env:MAKEAPPX pack /d staging /p out/zwana-quota-widget.msix /o *> makeappx.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content makeappx.log | Select-Object -Last 40
            throw "makeappx failed"
          }

      - name: Sign
        env:
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          $common = @('sign', '/fd', 'SHA256')
          $signer = if ($env:SIGN_WITH -eq 'pfx') {
            @('/f', "$PWD\signing.pfx", '/p', $env:MSIX_PFX_PASSWORD)
          } else {
            @('/sha1', $env:CERT_THUMBPRINT)
          }
          $target = 'out/zwana-quota-widget.msix'

          # A timestamp keeps the package installable after the certificate
          # expires; it needs the network, so a failure there is not fatal.
          & $env:SIGNTOOL @common @signer '/tr' 'http://timestamp.digicert.com' '/td' 'SHA256' $target
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::timestamping failed; signing without a timestamp"
            & $env:SIGNTOOL @common @signer $target
            if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          }

      - name: Assemble what gets downloaded
        run: |
          Copy-Item windows/install.ps1 out/install.ps1
          $msix = Get-Item out/zwana-quota-widget.msix
          $mb = '{0:N1}' -f ($msix.Length / 1MB)
          "::notice::${{ matrix.variant }}: $mb MB"

          # What the download is actually made of. Every byte crosses a metered
          # link, so where it goes is worth being able to read rather than guess.
          Get-ChildItem staging -Recurse -File |
            Sort-Object Length -Descending | Select-Object -First 10 |
            Format-Table @{n='MB';e={'{0:N1}' -f ($_.Length / 1MB)}}, Name -AutoSize

          "package: $mb MB" | Write-Host

      - uses: actions/upload-artifact@v4
        with:
          name: zwana-quota-widget-${{ matrix.variant }}
          path: out/
          retention-days: 30
          if-no-files-found: error
